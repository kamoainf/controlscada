version: '3.8'

services:
  # Backend Express
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - WHATSAPP_API_KEY=${WHATSAPP_API_KEY}
      - WHATSAPP_API_BASE_URL=${WHATSAPP_API_BASE_URL}
      - INSTANCE_NAME=kamoa-instance-1
      - PORT=8080
    volumes:
      - ./src:/app/src
    restart: always

  # Optional: Evolution API locally (for testing)
  # evolution:
  #   image: atendai/evolution-api:latest
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - EVOLUTION_API_URL=http://evolution:3000
  #     - EVOLUTION_API_KEY=your_key
